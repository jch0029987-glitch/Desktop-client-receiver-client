name: Scaffold Flutter Project Structure

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate Flutter Project Structure
        run: |
          # Scaffolds app with organization com.jeremy.desktop and project name receiver -> package name com.jeremy.desktop.receiver
          flutter create . --org com.jeremy.desktop --project-name receiver --platforms=android
          flutter pub get

      - name: Commit and Push Generated Project Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-scaffold Flutter project structure with package com.jeremy.desktop.receiver"
          git push
